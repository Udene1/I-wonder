name: MCP smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Probe I Wonder MCP (modern and legacy protocols)
        env:
          MCP_URL: https://i-wonder-ashen.vercel.app/api/mcp
        run: |
          node <<'NODE'
          const url = process.env.MCP_URL;
          const expected = [
            "list_wonders",
            "create_wonder",
            "get_wonder",
            "search_wonders",
            "append_to_wonder",
            "edit_wonder",
            "update_wonder",
            "find_rabbit_holes",
            "link_wonders",
            "unlink_wonders",
          ];

          async function post(message, headers = {}) {
            const res = await fetch(url, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "accept": "application/json, text/event-stream",
                ...headers,
              },
              body: JSON.stringify(message),
            });
            const body = await res.text();
            console.log("\n--- " + message.method + " ---");
            console.log("HTTP " + res.status);
            console.log("content-type:", res.headers.get("content-type"));
            console.log(body);
            if (!res.ok) throw new Error(message.method + " failed with HTTP " + res.status);
            return body;
          }

          // Current MCP 2026-07-28 stateless protocol.
          await post({
            jsonrpc: "2.0",
            id: 1,
            method: "server/discover",
            params: {
              _meta: {
                "io.modelcontextprotocol/protocolVersion": "2026-07-28",
                "io.modelcontextprotocol/clientInfo": { name: "i-wonder-ci", version: "1.0.0" },
                "io.modelcontextprotocol/clientCapabilities": {},
              },
            },
          }, {
            "MCP-Protocol-Version": "2026-07-28",
            "Mcp-Method": "server/discover",
          });

          const modern = await post({
            jsonrpc: "2.0",
            id: 2,
            method: "tools/list",
            params: {
              _meta: {
                "io.modelcontextprotocol/protocolVersion": "2026-07-28",
                "io.modelcontextprotocol/clientInfo": { name: "i-wonder-ci", version: "1.0.0" },
                "io.modelcontextprotocol/clientCapabilities": {},
              },
            },
          }, {
            "MCP-Protocol-Version": "2026-07-28",
            "Mcp-Method": "tools/list",
          });

          for (const name of expected) {
            if (!modern.includes(name)) throw new Error("Modern tools/list missing " + name);
          }

          // Legacy Streamable HTTP compatibility used by older MCP clients.
          const init = await post({
            jsonrpc: "2.0",
            id: 3,
            method: "initialize",
            params: {
              protocolVersion: "2025-11-25",
              capabilities: {},
              clientInfo: { name: "i-wonder-ci-legacy", version: "1.0.0" },
            },
          });

          await post({
            jsonrpc: "2.0",
            method: "notifications/initialized",
            params: {},
          });

          const legacy = await post({
            jsonrpc: "2.0",
            id: 4,
            method: "tools/list",
            params: {},
          });

          for (const name of expected) {
            if (!legacy.includes(name)) throw new Error("Legacy tools/list missing " + name);
          }

          console.log("\nMCP SMOKE TEST PASSED: modern and legacy clients both receive all 10 tools.");
          NODE
