name: MCP smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Probe I Wonder MCP
        env:
          MCP_URL: https://i-wonder-ashen.vercel.app/api/mcp
        run: |
          node <<'NODE'
          const url = process.env.MCP_URL;

          async function request(message) {
            const res = await fetch(url, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "accept": "application/json, text/event-stream",
              },
              body: JSON.stringify(message),
            });
            const body = await res.text();
            console.log("\n--- " + message.method + " ---");
            console.log("HTTP " + res.status);
            console.log("content-type:", res.headers.get("content-type"));
            console.log("mcp-session-id:", res.headers.get("mcp-session-id"));
            console.log(body);
            if (!res.ok) throw new Error(message.method + " failed with HTTP " + res.status);
            return { res, body };
          }

          await request({
            jsonrpc: "2.0",
            id: 1,
            method: "initialize",
            params: {
              protocolVersion: "2025-06-18",
              capabilities: {},
              clientInfo: { name: "i-wonder-ci", version: "1.0.0" },
            },
          });

          await request({
            jsonrpc: "2.0",
            method: "notifications/initialized",
            params: {},
          });

          const listed = await request({
            jsonrpc: "2.0",
            id: 2,
            method: "tools/list",
            params: {},
          });

          const expected = [
            "list_wonders",
            "create_wonder",
            "get_wonder",
            "search_wonders",
            "append_to_wonder",
            "edit_wonder",
            "update_wonder",
            "find_rabbit_holes",
            "link_wonders",
            "unlink_wonders",
          ];

          const missing = expected.filter(name => !listed.body.includes(name));
          if (missing.length) {
            throw new Error("Expected MCP tools missing from tools/list response: " + missing.join(", "));
          }

          console.log("\nMCP SMOKE TEST PASSED: all 10 expected tools were returned.");
          NODE
