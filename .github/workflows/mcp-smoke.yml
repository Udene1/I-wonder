name: MCP smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Probe I Wonder MCP (modern 2026 protocol)
        env:
          MCP_URL: https://i-wonder-ashen.vercel.app/api/mcp
        run: |
          node <<'NODE'
          const url = process.env.MCP_URL;

          async function request(method, id, params = {}) {
            const body = {
              jsonrpc: "2.0",
              ...(id !== undefined ? { id } : {}),
              method,
              params,
            };

            const headers = {
              "content-type": "application/json",
              "accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": "2026-07-28",
              "Mcp-Method": method,
            };

            const res = await fetch(url, {
              method: "POST",
              headers,
              body: JSON.stringify(body),
            });

            const text = await res.text();
            console.log("\n--- " + method + " ---");
            console.log("HTTP " + res.status);
            console.log("content-type:", res.headers.get("content-type"));
            console.log(text);

            if (!res.ok) throw new Error(method + " failed with HTTP " + res.status);
            return text;
          }

          await request("server/discover", 1, {
            _meta: {
              "io.modelcontextprotocol/protocolVersion": "2026-07-28",
              "io.modelcontextprotocol/clientInfo": { name: "i-wonder-ci", version: "1.0.0" },
              "io.modelcontextprotocol/clientCapabilities": {},
            },
          });

          const listed = await request("tools/list", 2, {
            _meta: {
              "io.modelcontextprotocol/protocolVersion": "2026-07-28",
              "io.modelcontextprotocol/clientInfo": { name: "i-wonder-ci", version: "1.0.0" },
              "io.modelcontextprotocol/clientCapabilities": {},
            },
          });

          const expected = [
            "list_wonders",
            "create_wonder",
            "get_wonder",
            "search_wonders",
            "append_to_wonder",
            "edit_wonder",
            "update_wonder",
            "find_rabbit_holes",
            "link_wonders",
            "unlink_wonders",
          ];

          const missing = expected.filter(name => !listed.includes(name));
          if (missing.length) {
            throw new Error("Expected MCP tools missing from tools/list response: " + missing.join(", "));
          }

          console.log("\nMCP MODERN SMOKE TEST PASSED: all 10 expected tools were returned.");
          NODE
